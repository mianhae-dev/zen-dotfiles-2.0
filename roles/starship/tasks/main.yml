---
- name: "Checking for distribution: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: starship_distribution_conf

- name: "Run distribution specific tasks: ansiblle_facts[distribution]"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: starship_distribution_conf.stat.exists

- name: "Ensure starship configurtion file path"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/zsh/var/var.zsh"
    line: export STARSHIP_CONFIG="{{ ansible_facts['user_dir'] }}/.config/starship/starship.toml"
    state: present
    insertafter: EOF

- name: "Ensure starship load is in .zshrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zshrc"
    line: eval "$(starship init zsh)"
    state: present
    insertafter: EOF

- name: "Ensure starship config direcotry exist"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/starship"
    state: directory
    mode: "0700"

- name: "Deploy starship config"
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/starship/starship.toml"
    mode: "0644"
