---
- name: "Checking for distribution: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: distribution_conf

- name: "Run distribution specific tasks: {{ ansiblle_distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: distribution_conf.stat.exists

- name: "Ensure starship configurtion file path"
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/zsh/var/var.zsh"
    line: export STARSHIP_CONFIG="{{ ansible_user_dir }}/.config/starship/starship.toml"
    state: present
    insertafter: EOF

- name: "Ensure starship load is in .zshrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: eval "$(starship init zsh)"
    state: present
    insertafter: EOF

- name: "Ensure starship config direcotry exist"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/starship"
    state: directory
    mode: "0700"

- name: "Deploy starship config"
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ ansible_user_dir }}/.config/starship/starship.toml"
    mode: "0644"
