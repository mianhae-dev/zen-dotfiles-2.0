---
- name: "Checking for distribution: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: zsh_distribution_config

- name: "Run distribution specific tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: zsh_distribution_config.stat.exists

- name: "Ensure zsh config directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config/zsh"
    - "{{ ansible_facts['user_dir'] }}/.config/zsh/alias"
    - "{{ ansible_facts['user_dir'] }}/.config/zsh/function"
    - "{{ ansible_facts['user_dir'] }}/.config/zsh/var"

- name: "Deploy zsh configuration files"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: ".zshrc", dest: "{{ ansible_facts['user_dir'] }}/.zshrc" }
    - { src: "alias/", dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/alias/" }
    - { src: "function/", dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/function/" }
    - { src: "var/", dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/var/" }
