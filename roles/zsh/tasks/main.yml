---
- name: "Checking for distribution: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: distribution_config

- name: "Run distribution specific tasks: {{ ansible_distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: distribution_config.stat.exists

- name: "Ensure zsh config directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ ansible_user_dir }}/.config/zsh"
    - "{{ ansible_user_dir }}/.config/zsh/alias"
    - "{{ ansible_user_dir }}/.config/zsh/function"
    - "{{ ansible_user_dir }}/.config/zsh/var"

- name: "Deploy zsh configuration files"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: ".zshrc", dest: "{{ ansible_user_dir }}/.zshrc" }
    - { src: "alias/", dest: "{{ ansible_user_dir }}/.config/zsh/alias/" }
    - { src: "function/", dest: "{{ ansible_user_dir }}/.config/zsh/function/" }
    - { src: "var/", dest: "{{ ansible_user_dir }}/.config/zsh/var/" }
