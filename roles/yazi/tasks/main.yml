---
- name: "Checking for distribution donfig: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: yazi_distribution_config

- name: "Run Tasks for distribution: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: yazi_distribution_config.stat.exists

- name: "Ensure yazi config directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.config"
    - "{{ ansible_facts['user_dir'] }}/.config/yazi"

- name: "Deploy yazi config"
  ansible.builtin.copy:
    src: "files/"
    dest: "{{ ansible_facts['user_dir'] }}/.config/yazi/"
    mode: "0644"

- name: Install yazi packages
  ansible.builtin.command: ya pkg add "{{ item }}"
  loop: "{{ yazi_plugins + yazi_themes }}"
  register: yazi_result
  failed_when: >
    yazi_result.rc != 0 and
    'already exists in package.toml' not in yazi_result.stderr | default('')
  changed_when: "'already exists in package.toml' not in yazi_result.stderr | default('')"
  loop_control:
    label: "{{ item }}"
